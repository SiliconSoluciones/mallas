{% extends "base.html" %}
{% block title %}Nueva Asesora{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-lg">
        <div class="card-header bg-success text-white">
            <h4><i class="fas fa-user-plus"></i> Registrar Nueva Asesora</h4>
        </div>
        
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Nombre completo</label>
                    <input type="text" class="form-control" name="nombre" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" class="form-control" name="usuario" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" name="contraseña" required>
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" name="es_admin" id="es_admin">
                    <label class="form-check-label" for="es_admin">Es administrador</label>
                </div>
                
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save"></i> Guardar
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
